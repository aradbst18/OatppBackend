name: Extended CI
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presets:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - preset: relwithdebinfo
          - preset: relwithdebinfo-asan-ubsan
          - preset: debug-tsan
          - preset: relwithdebinfo-tsan
          # shortcut: MSan is configure-only, enable runtime tests once stdlib/dependencies are instrumented.
          - preset: debug-msan
            compiler: clang
            configure-only: true
          - preset: relwithdebinfo-msan
            compiler: clang
            configure-only: true
    uses: ./.github/workflows/build.yml
    with:
      preset: ${{ matrix.preset }}
      compiler: ${{ matrix.compiler || 'gcc' }}
      configure-only: ${{ matrix.configure-only || false }}
  features:
    name: ${{ matrix.config }} config / ${{ matrix.version }} version
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - config: JSON
            version: JSON
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=ON -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_CONFIG_FORMAT=JSON -DAPP_VERSION_FILE_FORMAT=JSON -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=OFF
          - config: JSON
            version: TOML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA512 -DAPP_CONFIG_FORMAT=JSON -DAPP_VERSION_FILE_FORMAT=TOML -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=OFF
          - config: JSON
            version: XML
            options: -DAPP_USERS_DATABASE_TYPE=POSTGRESQL -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA384 -DAPP_CONFIG_FORMAT=JSON -DAPP_VERSION_FILE_FORMAT=XML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=OFF
          - config: JSON
            version: YAML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=ON -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_CONFIG_FORMAT=JSON -DAPP_VERSION_FILE_FORMAT=YAML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=ON
          - config: TOML
            version: JSON
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA384 -DAPP_CONFIG_FORMAT=TOML -DAPP_VERSION_FILE_FORMAT=JSON -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=OFF
          - config: TOML
            version: TOML
            options: -DAPP_USERS_DATABASE_TYPE=POSTGRESQL -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=OFF -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_CONFIG_FORMAT=TOML -DAPP_VERSION_FILE_FORMAT=TOML -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=OFF
          - config: TOML
            version: XML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=ON -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA512 -DAPP_CONFIG_FORMAT=TOML -DAPP_VERSION_FILE_FORMAT=XML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=OFF
          - config: TOML
            version: YAML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA384 -DAPP_CONFIG_FORMAT=TOML -DAPP_VERSION_FILE_FORMAT=YAML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=ON
          - config: XML
            version: JSON
            options: -DAPP_USERS_DATABASE_TYPE=POSTGRESQL -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA512 -DAPP_CONFIG_FORMAT=XML -DAPP_VERSION_FILE_FORMAT=JSON -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=OFF
          - config: XML
            version: TOML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=ON -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA384 -DAPP_CONFIG_FORMAT=XML -DAPP_VERSION_FILE_FORMAT=TOML -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=OFF
          - config: XML
            version: XML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_CONFIG_FORMAT=XML -DAPP_VERSION_FILE_FORMAT=XML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=OFF
          - config: XML
            version: YAML
            options: -DAPP_USERS_DATABASE_TYPE=POSTGRESQL -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=OFF -DAPP_PASSWORD_HASH_ALGO=SHA512 -DAPP_CONFIG_FORMAT=XML -DAPP_VERSION_FILE_FORMAT=YAML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=ON
          - config: YAML
            version: JSON
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=ON -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_CONFIG_FORMAT=YAML -DAPP_VERSION_FILE_FORMAT=JSON -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=ON -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=ON
          - config: YAML
            version: TOML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA512 -DAPP_CONFIG_FORMAT=YAML -DAPP_VERSION_FILE_FORMAT=TOML -DAPP_ENABLE_SWAGGER=ON -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=ON -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=ON
          - config: YAML
            version: XML
            options: -DAPP_USERS_DATABASE_TYPE=POSTGRESQL -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA384 -DAPP_CONFIG_FORMAT=YAML -DAPP_VERSION_FILE_FORMAT=XML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=ON -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=ON -DAPP_ENABLE_YAML_PARSER=ON
          - config: YAML
            version: YAML
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENCRYPTION_USER_DATABASE=ON -DAPP_ENABLE_SQLCIPHER=ON -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_CONFIG_FORMAT=YAML -DAPP_VERSION_FILE_FORMAT=YAML -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=OFF -DAPP_ENABLE_YAML_PARSER=ON
    uses: ./.github/workflows/build.yml
    with:
      preset: debug
      options: ${{ matrix.options }}
