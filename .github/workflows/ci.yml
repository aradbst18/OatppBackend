name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presets:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        preset: [debug, debug-asan-ubsan, release, minsizerel]
    uses: ./.github/workflows/build.yml
    with:
      preset: ${{ matrix.preset }}
      checks: ${{ matrix.preset == 'debug' }}
  features:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Plain SQLCipher / JSON / SHA256
            options: -DAPP_USERS_DATABASE_TYPE=SQLCIPHER -DAPP_ENABLE_POSTGRESQL=OFF -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_CONFIG_FORMAT=JSON -DAPP_PASSWORD_HASH_ALGO=SHA256 -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=OFF
          - name: PostgreSQL / YAML / SHA384 / no file support
            options: -DAPP_USERS_DATABASE_TYPE=POSTGRESQL -DAPP_ENABLE_SQLCIPHER=OFF -DAPP_ENCRYPTION_USER_DATABASE=OFF -DAPP_CONFIG_FORMAT=YAML -DAPP_VERSION_FILE_FORMAT=YAML -DAPP_PASSWORD_HASH_ALGO=SHA384 -DAPP_ENABLE_SWAGGER=OFF -DAPP_ENABLE_ZLIB=OFF -DAPP_ENABLE_JSON_PARSER=OFF -DAPP_ENABLE_TOML_PARSER=OFF -DAPP_ENABLE_XML_PARSER=OFF
    uses: ./.github/workflows/build.yml
    with:
      preset: debug
      options: ${{ matrix.options }}
