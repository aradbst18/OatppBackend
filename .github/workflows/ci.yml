name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.preset }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ debug, release, debug-asan-ubsan ]
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGDATABASE: postgres
      PGUSER: oatpp_tester

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libsqlcipher-dev \
            libpq-dev \
            postgresql \
            libjsoncpp-dev \
            libyaml-cpp-dev \
            libpugixml-dev

      - name: Cache Oat++ installation
        id: cache-oatpp
        uses: actions/cache@v4
        with:
          path: /usr/local/include/oatpp-1.3.0
          key: oatpp-1.3.0-ubuntu-22.04

      - name: Install Oat++ modules
        if: steps.cache-oatpp.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 1.3.0-latest https://github.com/oatpp/oatpp.git
          cmake -B oatpp/build -S oatpp -DCMAKE_BUILD_TYPE=Release -DOATPP_BUILD_TESTS=OFF
          sudo cmake --build oatpp/build --target install --parallel $(nproc)

          for mod in oatpp-swagger oatpp-zlib oatpp-sqlite oatpp-postgresql; do
            git clone --depth 1 --branch 1.3.0-latest https://github.com/oatpp/${mod}.git
            cmake -B ${mod}/build -S ${mod} -DCMAKE_BUILD_TYPE=Release -DOATPP_BUILD_TESTS=OFF
            sudo cmake --build ${mod}/build --target install --parallel $(nproc)
          done

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel $(nproc)

      - name: Start test PostgreSQL
        id: postgres
        if: matrix.preset != 'release'
        run: |
          pg_bin="$(pg_config --bindir)"
          pg_root="$RUNNER_TEMP/test-postgres"
          mkdir -m 700 "$pg_root"
          PGPASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PGPASSWORD"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"
          (umask 077; printf '%s' "$PGPASSWORD" > "$pg_root/password")
          "$pg_bin/initdb" -D "$pg_root/data" -U "$PGUSER" \
            --auth=scram-sha-256 --pwfile="$pg_root/password"
          rm "$pg_root/password"
          "$pg_bin/pg_ctl" -D "$pg_root/data" -l "$pg_root/server.log" \
            -o "-h $PGHOST -p $PGPORT -k $pg_root" -w start

      - name: Run Tests
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --parallel $(nproc)

      - name: Stop test PostgreSQL
        if: always() && steps.postgres.outcome == 'success'
        run: |
          "$(pg_config --bindir)/pg_ctl" -D "$RUNNER_TEMP/test-postgres/data" -m fast -w stop
